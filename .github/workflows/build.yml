name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read and verify version
        id: version
        run: |
          set -euo pipefail
          gradle_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts | head -n1)
          plugin_version=$(python3 -c "import json;print(json.load(open('src/main/resources/zenithproxy.plugin.json'))['version'])")
          echo "build.gradle.kts: $gradle_version"
          echo "zenithproxy.plugin.json: $plugin_version"
          if [ "$gradle_version" != "$plugin_version" ]; then
            echo "::error::Version mismatch between build.gradle.kts and zenithproxy.plugin.json"
            exit 1
          fi
          echo "version=$gradle_version" >> "$GITHUB_OUTPUT"

      - name: Build shadow JAR
        run: ./gradlew --no-daemon --stacktrace clean build

      - name: Inspect artifact
        run: |
          set -euo pipefail
          ls -lh build/libs
          jar=$(ls build/libs/ZenithProxy-WebUI-*.jar | head -n1)
          echo "JAR: $jar"
          unzip -p "$jar" META-INF/MANIFEST.MF
          unzip -l "$jar" | grep -E "zenithproxy.plugin.json|web/index.html"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenithProxy-WebUI-${{ steps.version.outputs.version }}
          path: build/libs/ZenithProxy-WebUI-*.jar
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: ZenithProxy-WebUI-${{ needs.build.outputs.version }}
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/*.jar \
              --repo "$GITHUB_REPOSITORY" \
              --title "ZenithProxy-WebUI $TAG" \
              --generate-notes \
              --verify-tag
          fi
