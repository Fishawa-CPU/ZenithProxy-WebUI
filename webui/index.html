<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenithProxy Web UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="logo">
                <h1>ZenithProxy</h1>
                <span class="version" id="version">v26.1.2</span>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-page="dashboard">
                    <span class="icon">📊</span>
                    <span class="text">仪表板</span>
                </li>
                <li class="nav-item" data-page="modules">
                    <span class="icon">⚙️</span>
                    <span class="text">模块管理</span>
                </li>
                <li class="nav-item" data-page="config">
                    <span class="icon">📝</span>
                    <span class="text">配置管理</span>
                </li>
                <li class="nav-item" data-page="terminal">
                    <span class="icon">💻</span>
                    <span class="text">命令终端</span>
                </li>
                <li class="nav-item" data-page="logs">
                    <span class="icon">📋</span>
                    <span class="text">日志查看</span>
                </li>
                <li class="nav-item" data-page="players">
                    <span class="icon">👥</span>
                    <span class="text">玩家列表</span>
                </li>
            </ul>
            <div class="nav-footer">
                <div class="status-indicator" id="connectionStatus">
                    <span class="status-dot disconnected"></span>
                    <span class="status-text">未连接</span>
                </div>
            </div>
        </nav>
        
        <main class="main-content">
            <!-- Dashboard Page -->
            <section class="page active" id="dashboard">
                <div class="page-header">
                    <h2>状态监控仪表板</h2>
                    <button class="btn btn-primary" onclick="refreshDashboard()">刷新</button>
                </div>
                <div class="dashboard-grid">
                    <div class="stat-card">
                        <div class="stat-icon">🔗</div>
                        <div class="stat-info">
                            <h3>代理状态</h3>
                            <p id="proxyStatus">未连接</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">👤</div>
                        <div class="stat-info">
                            <h3>当前用户</h3>
                            <p id="currentUsername">-</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📡</div>
                        <div class="stat-info">
                            <h3>代理地址</h3>
                            <p id="proxyAddress">-</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">⏱️</div>
                        <div class="stat-info">
                            <h3>运行时间</h3>
                            <p id="uptime">-</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📈</div>
                        <div class="stat-info">
                            <h3>队列状态</h3>
                            <p id="queueStatus">不在队列中</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🎮</div>
                        <div class="stat-info">
                            <h3>Minecraft版本</h3>
                            <p id="mcVersion">-</p>
                        </div>
                    </div>
                </div>
            </section>
            
            <!-- Modules Page -->
            <section class="page" id="modules">
                <div class="page-header">
                    <h2>模块管理</h2>
                    <button class="btn btn-primary" onclick="refreshModules()">刷新</button>
                </div>
                <div class="modules-grid" id="modulesList">
                    <!-- Modules will be loaded here -->
                </div>
            </section>
            
            <!-- Config Page -->
            <section class="page" id="config">
                <div class="page-header">
                    <h2>配置管理</h2>
                    <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
                </div>
                <div class="config-container">
                    <div class="config-tabs">
                        <button class="config-tab active" data-tab="authentication">认证</button>
                        <button class="config-tab" data-tab="client">客户端</button>
                        <button class="config-tab" data-tab="server">服务器</button>
                        <button class="config-tab" data-tab="discord">Discord</button>
                        <button class="config-tab" data-tab="database">数据库</button>
                        <button class="config-tab" data-tab="debug">调试</button>
                    </div>
                    <div class="config-content" id="configContent">
                        <!-- Config forms will be loaded here -->
                    </div>
                </div>
            </section>
            
            <!-- Terminal Page -->
            <section class="page" id="terminal">
                <div class="page-header">
                    <h2>命令终端</h2>
                    <button class="btn btn-secondary" onclick="clearTerminal()">清空</button>
                </div>
                <div class="terminal-container">
                    <div class="terminal-output" id="terminalOutput">
                        <div class="terminal-welcome">
                            <p>ZenithProxy 命令终端</p>
                            <p>输入命令并按回车执行</p>
                        </div>
                    </div>
                    <div class="terminal-input-container">
                        <span class="terminal-prompt">&gt;</span>
                        <input type="text" class="terminal-input" id="terminalInput" placeholder="输入命令..." autofocus>
                    </div>
                </div>
            </section>
            
            <!-- Logs Page -->
            <section class="page" id="logs">
                <div class="page-header">
                    <h2>日志查看</h2>
                    <div class="log-controls">
                        <select id="logLevel" class="select" onchange="filterLogs()">
                            <option value="all">所有级别</option>
                            <option value="INFO">INFO</option>
                            <option value="WARN">WARN</option>
                            <option value="ERROR">ERROR</option>
                            <option value="DEBUG">DEBUG</option>
                        </select>
                        <button class="btn btn-secondary" onclick="clearLogs()">清空</button>
                        <button class="btn btn-secondary" onclick="exportLogs()">导出</button>
                    </div>
                </div>
                <div class="logs-container">
                    <div class="logs-output" id="logsOutput">
                        <div class="log-empty">等待日志...</div>
                    </div>
                </div>
            </section>
            
            <!-- Players Page -->
            <section class="page" id="players">
                <div class="page-header">
                    <h2>玩家列表</h2>
                    <button class="btn btn-primary" onclick="refreshPlayers()">刷新</button>
                </div>
                <div class="players-container">
                    <table class="players-table">
                        <thead>
                            <tr>
                                <th>玩家名称</th>
                                <th>UUID</th>
                                <th>类型</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="playersList">
                            <!-- Players will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
